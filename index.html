<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Brote</title>
        <style>
            body {
                background: linear-gradient(135deg, #bdbdbd, #657079, #887c83);
min-height: 100vh;
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
            }
            img {
                width: 120px;
                border-radius: 50%;
            }

            h1 {
                color: white;
                text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3);
                font-size: xx-large;
            }

            h3 {
                color: white;
            }

            ul {
  list-style: none;
  padding: 0;
}

            li {
                color: black;
                text-align: center;
            }

            

            a {
                display: block;
                max-width: 400px;
                margin: 12px auto;
                padding: 15px;
                border-radius: 20px;
                text-decoration: none;
                color: white;
                font-weight: bold;

                background: rgba(255, 255, 255, 0.15);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.4);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.6);
                transition: all 0.3s;
}

            a:hover {
                background: rgba(255, 255, 255, 0.3);
                transform: scale(1.04);
}

</style>
    </head>
    <body>
        <img src="foto.jpg" alt="Mi foto">
        <h1>Hola, soy Adri</h1>
        <p>Esta es mi primera página web.</p>
        <h3>Mis hobbies:</h3>
        <ul>
            <li>Sports</li>
            <li>Coding</li>
            <li>Start-Ups</li>
        </ul>
        <nav id="enlaces"></nav>
<script>
    const enlaces = [
        {titulo: "Mi linkedin", url: "https://www.linkedin.com/in/arivasalonso/"},
        {titulo:"Mi GitHub", url:"https://github.com/adrivasalon"},
        {titulo: "Mi instagram", url:"https://instagram.com"}
];
    const contenedor = document.getElementById("enlaces");
    for (const enlace of enlaces) {
        const boton = document.createElement("a");
        boton.textContent = enlace.titulo;
        boton.href = enlace.url;
        boton.target = "_blank";
        contenedor.appendChild(boton);
    }

</script>
    </body>
</html>
